:root{
  --bg:#F3EDE0; --surface:#FFFDF8; --surface-2:#EFE7D5; --line:#DCD1B9; --fg:#17140F; --muted:#6B6250;

  --shadow:0 1px 2px rgba(40,30,10,.05),0 6px 18px rgba(40,30,10,.06);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0C0C; --surface:#161616; --surface-2:#1E1E1E; --line:#2E2A23; --fg:#F2ECDD; --muted:#A39A86;
  --gold:#D2B26A; --ink:#050505; --ink-2:#141414; --on-ink:#F5EFE0; --on-ink-muted:#A39A86; --gold-on-ink:#E2C988;
  --up:#7DB57B; --on-up:#0C0C0C; --down:#E58A80; --info:#8FAEDC; --warn:#E3B25C; --input:#101010;
  --band-mev:rgba(143,174,220,.18); --band-mav:rgba(210,178,106,.34); --band-mrv:rgba(229,138,128,.22);
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0C0C; --surface:#161616; --surface-2:#1E1E1E; --line:#2E2A23; --fg:#F2ECDD; --muted:#A39A86;
  --gold:#D2B26A; --ink:#050505; --ink-2:#141414; --on-ink:#F5EFE0; --on-ink-muted:#A39A86; --gold-on-ink:#E2C988;
  --up:#7DB57B; --on-up:#0C0C0C; --down:#E58A80; --info:#8FAEDC; --warn:#E3B25C; --input:#101010;
  --band-mev:rgba(143,174,220,.18); --band-mav:rgba(210,178,106,.34); --band-mrv:rgba(229,138,128,.22);
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{background:var(--bg)}
body{margin:0;color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}

/* Cabeçalho */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--ink);color:var(--on-ink);border-bottom:1px solid rgba(226,201,136,.4)}
.top-in{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px;display:grid;gap:10px}
.brand-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.brand .eyebrow{color:var(--on-ink-muted)}
.brand h1{margin:3px 0 0;font-family:var(--f-display);font-weight:700;font-size:25px;line-height:1;letter-spacing:.05em;text-transform:uppercase;color:var(--gold-on-ink)}
.status{font-size:11.5px;color:var(--on-ink-muted);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding-bottom:2px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:#7DB57B}
.status.busy::before{background:var(--gold-on-ink)}
.status.err::before{background:#E58A80}
.status.off::before{background:#8FAEDC}
.athletes{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--ink-2);padding:4px;border-radius:12px}
.athletes button{border:0;background:transparent;color:var(--on-ink-muted);border-radius:9px;padding:7px 10px;text-align:left;display:grid;gap:1px;line-height:1.15}
.athletes b{font-family:var(--f-display);font-size:18px;font-weight:600;letter-spacing:.02em;color:var(--on-ink)}
.athletes small{font-size:11px}
.athletes button[aria-pressed="true"]{background:#2A2418;box-shadow:inset 0 0 0 1px rgba(226,201,136,.55)}
.athletes button[aria-pressed="true"] b{color:var(--gold-on-ink)}

/* Estrutura */
.main{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px calc(90px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
body.timing .main{padding-bottom:calc(170px + env(safe-area-inset-bottom,0px))}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);border-top:1px solid rgba(226,201,136,.3);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
.nav button{background:none;border:0;color:var(--on-ink-muted);display:grid;justify-items:center;gap:2px;padding:7px 0 5px;font-size:10.5px;letter-spacing:.04em;position:relative;min-width:0}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--gold-on-ink)}
.nav button[aria-current="page"]::before{content:"";position:absolute;top:-4px;left:30%;right:30%;height:2px;border-radius:2px;background:var(--gold-on-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;box-shadow:var(--shadow);min-width:0}
.card h2{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.card p{margin:0}
.lead{font-size:14.5px;color:var(--muted);max-width:62ch}
.list{margin:0;padding-left:18px;display:grid;gap:7px}
.muted{color:var(--muted)}
.sec-t{margin:6px 2px 0;font-family:var(--f-display);font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Aviso de permissão */
.perm{border:1px solid var(--info);background:var(--surface);border-radius:14px;padding:12px 14px;display:grid;gap:4px;box-shadow:inset 4px 0 0 var(--info)}
.perm b{font-family:var(--f-display);font-size:17px;font-weight:600;color:var(--info)}
.perm p{margin:0;font-size:13.5px;color:var(--muted);max-width:62ch}

/* Dias e semana */
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(46px,1fr));gap:6px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 2px 5px;display:grid;justify-items:center;gap:1px;line-height:1.05}
.day .dw{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.day b{font-family:var(--f-display);font-size:22px;font-weight:700}
.day .dd{width:6px;height:6px;border-radius:50%;margin-top:2px;background:transparent}
.day .dd.on{background:var(--up)}
.day[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--gold-on-ink);box-shadow:inset 0 -3px 0 var(--gold-on-ink)}
.day[aria-pressed="true"] .dw{color:var(--on-ink-muted)}
.week{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px;display:grid;gap:8px;box-shadow:var(--shadow)}
.week-nav{display:grid;grid-template-columns:42px 1fr 42px;gap:6px;align-items:center}
.icon-btn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:22px;line-height:1;display:grid;place-items:center}
.icon-btn:disabled{opacity:.35;cursor:default}
.week-mid{text-align:center;min-width:0}
.week-mid .eyebrow{color:var(--muted)}
.week-mid .eyebrow em{font-style:normal;color:var(--gold)}
.week-mid b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:.02em}
.week-foco{margin:0;text-align:center;color:var(--muted);font-size:13.5px;text-wrap:balance;padding-inline:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.tag.gold{background:transparent;border-color:var(--gold);color:var(--gold)}
.tag.warn{background:transparent;border-color:var(--warn);color:var(--warn)}
.tag.info{background:transparent;border-color:var(--info);color:var(--info)}

/* Sessão */
.hero{background:var(--ink);color:var(--on-ink);border-radius:18px;padding:16px;display:grid;gap:12px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;left:0;top:0;right:0;height:3px;background:linear-gradient(90deg,var(--gold-on-ink),rgba(226,201,136,0))}
.hero-top{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
.hero .eyebrow{color:var(--gold-on-ink)}
.hero h2{margin:4px 0;font-family:var(--f-display);font-size:25px;line-height:1.05;letter-spacing:.02em;text-transform:uppercase;color:var(--on-ink);text-wrap:balance}
.hero p{margin:0;color:var(--on-ink-muted);font-size:14px}
.ring{width:74px;height:74px;position:relative;flex:none}
.ring svg{display:block;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center;font-family:var(--f-display);line-height:1}
.ring .rv b{font-size:21px;color:var(--on-ink)}
.ring .rv small{font-size:10px;color:var(--on-ink-muted);letter-spacing:.08em;text-transform:uppercase;margin-top:2px}
.hero-chips{display:flex;flex-wrap:wrap;gap:6px}
.hero-chips span{font-size:12.5px;border:1px solid rgba(245,239,224,.2);border-radius:999px;padding:3px 10px;font-variant-numeric:tabular-nums}
.hero-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.hero-row label{font-size:12.5px;color:var(--on-ink-muted)}
.hero-row input{background:var(--ink-2);border:1px solid rgba(245,239,224,.22);border-radius:10px;padding:7px 9px;color:var(--on-ink);color-scheme:dark}
.btn-gold{margin-left:auto;border:1px solid var(--gold-on-ink);background:transparent;color:var(--gold-on-ink);border-radius:10px;padding:8px 14px;font-weight:600}
.btn-gold[aria-pressed="true"]{background:var(--gold-on-ink);color:#141414}

/* Exercício */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:10px;box-shadow:var(--shadow);min-width:0}
.ex.quiet{background:var(--surface-2);box-shadow:none}
.ex-h{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start}
.num{width:34px;height:34px;border-radius:10px;background:var(--ink);color:var(--gold-on-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:16px}
.num.q{background:transparent;border:1px solid var(--line);color:var(--muted);font-size:12.5px}
.ex-t{min-width:0}
.ex h3{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.12;letter-spacing:.01em}
.rx{margin:3px 0 0;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rx b{color:var(--fg);font-weight:600}
.mini{display:inline-block;font-size:11px;padding:0 7px;border-radius:999px;border:1px solid var(--warn);color:var(--warn);margin-left:4px;vertical-align:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.tec{border:1px solid var(--gold);color:var(--gold);background:transparent;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 6px 3px 10px;display:inline-flex;align-items:center;gap:6px}
.tec i{font-style:normal;width:15px;height:15px;border-radius:50%;border:1px solid currentColor;font-size:10px;display:grid;place-items:center;line-height:1}
.tec.cl{border-color:var(--info);color:var(--info)}
.delta{font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.eq{color:var(--muted)}
details.how summary{list-style:none;cursor:pointer;font-size:13px;font-weight:600;color:var(--gold);display:inline-flex;gap:7px;align-items:center}
details.how summary::-webkit-details-marker{display:none}
details.how summary .yt{display:inline-flex;align-items:center;gap:5px;margin-left:6px;padding:3px 9px 3px 6px;border:1px solid var(--line);border-radius:999px;color:var(--fg);text-decoration:none;font-size:12px;font-weight:600;background:var(--surface-2)}
details.how summary button.yt{cursor:pointer}
.vid{position:relative;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
details.how summary .yt svg{width:16px;height:16px;flex:none}
details.how summary .yt:active{transform:scale(.97)}
details.how summary::before{content:"+";display:grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid currentColor;font-size:13px;line-height:1}
details.how[open] summary::before{content:"−"}
details.how .body{margin-top:8px;display:grid;gap:6px}
details.how p{margin:0;font-size:14px;line-height:1.5;max-width:62ch}
.conta{font-size:12.5px;color:var(--muted)}
.sets{display:grid;gap:6px}
.set{display:grid;grid-template-columns:24px minmax(0,1fr) minmax(0,1fr) 46px;gap:8px;align-items:center}
.set.nc{grid-template-columns:24px minmax(0,1fr) 46px}
.sn{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--muted);text-align:center}
.field{position:relative;display:block;min-width:0}
.field input{width:100%;min-width:0;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:10px 40px 10px 11px;font-family:var(--f-display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--muted);opacity:.55;font-weight:500}
.field span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--muted);pointer-events:none}
.ok{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);font-size:18px;font-weight:700;display:grid;place-items:center}
.ok svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.ok[aria-pressed="true"]{background:var(--up);border-color:var(--up);color:var(--on-up)}
.ex-f{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.link{background:none;border:1px dashed var(--line);border-radius:9px;padding:5px 10px;font-size:12.5px;color:var(--muted)}
.prev{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.check label{display:flex;gap:8px;align-items:center;font-weight:600}
.check input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
.check input[type=text]{flex:1 1 180px;min-width:0;background:var(--input);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.small{margin:4px 0 0;font-size:13px;color:var(--muted)}
.notes{display:grid;gap:6px}
.notes textarea{width:100%;min-height:90px;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
details.guide{background:var(--surface-2);border-radius:14px;padding:12px 14px}
details.guide summary{cursor:pointer;font-weight:600}
details.guide ul{margin:8px 0 0;padding-left:18px;display:grid;gap:5px;font-size:14px}

/* Tabelas */
.chipsbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:center;white-space:nowrap}
thead th{background:var(--ink);color:var(--gold-on-ink);font-family:var(--f-display);font-weight:600;letter-spacing:.05em;font-size:13.5px}
th.row{position:sticky;left:0;background:var(--surface);text-align:left;min-width:150px;max-width:190px;white-space:normal;line-height:1.2;font-weight:600;z-index:1}
thead th.row{background:var(--ink);z-index:2}
td.cell{cursor:pointer}
td .r{display:block;font-size:10.5px;color:var(--muted)}
td.cur{box-shadow:inset 0 -3px 0 var(--gold)}
.var-up{color:var(--up);font-weight:600} .var-down{color:var(--down);font-weight:600} .var-nt{color:var(--info);font-weight:600}

/* Volume */
.vlegend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted)}
.vlegend span{display:inline-flex;align-items:center;gap:6px}
.vlegend i{width:16px;height:9px;border-radius:3px;display:inline-block}
.vlist{display:grid;gap:8px}
.vrow{display:grid;gap:7px;padding:11px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface);text-align:left;width:100%;color:var(--fg)}
.vtop{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.vtop b{font-family:var(--f-display);font-size:17px;font-weight:600}
.vval{font-family:var(--f-display);font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.vval small{font-size:12px;font-weight:500;color:var(--muted);margin-left:3px}
.vbar{position:relative;height:12px;border-radius:6px;background:var(--surface-2)}
.vbar i{position:absolute;top:0;bottom:0}
.vbar i:first-child{border-radius:6px 0 0 6px}
.b-mev{background:var(--band-mev)} .b-mav{background:var(--band-mav)} .b-mrv{background:var(--band-mrv)}
.vbar .mk{position:absolute;top:-4px;bottom:-4px;width:5px;border-radius:3px;transform:translateX(-50%);background:var(--fg);box-shadow:0 0 0 2px var(--surface)}
.vsub{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.st-ok,.st-max{color:var(--gold)} .st-high{color:var(--warn)} .st-mrv,.st-over{color:var(--down)} .st-mev{color:var(--info)} .st-low,.st-na{color:var(--muted)}
.mk.st-ok,.mk.st-max{background:var(--gold)} .mk.st-high{background:var(--warn)} .mk.st-mrv,.mk.st-over{background:var(--down)} .mk.st-mev{background:var(--info)}
.vnote{font-size:12.5px;color:var(--muted);margin:0}

/* Plano */
.agenda,.weeks{display:grid;gap:6px}
.ag{display:grid;grid-template-columns:44px 34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;width:100%;color:var(--fg)}
.ag .d{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.ag .t{font-weight:600;min-width:0;line-height:1.25}
.ag .m{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.ag.rest{background:var(--surface-2)}
.ag .num{width:30px;height:30px;font-size:15px;border-radius:9px}
.wk{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;align-items:start;padding:10px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left;width:100%;color:var(--fg)}
.wk.cur{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.wk.dl{background:var(--surface-2)}
.wk .n{font-family:var(--f-display);font-size:24px;font-weight:700;text-align:center;line-height:1}
.wk .n small{display:block;font-size:9.5px;color:var(--muted);letter-spacing:.1em;font-weight:600;margin-bottom:2px}
.wk .f b{font-family:var(--f-display);font-size:16.5px;font-weight:600}
.wk .f p{margin:2px 0 7px;font-size:13px;color:var(--muted)}
.wk .tags{justify-content:flex-start}

/* Medidas */
.chart svg{display:block;width:100%;height:auto}
.grid-f{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.grid-f label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.grid-f input{background:var(--input);border:1px solid var(--line);border-radius:10px;padding:9px;width:100%;min-width:0;font-variant-numeric:tabular-nums}
.btn{justify-self:start;background:var(--ink);color:var(--gold-on-ink);border:1px solid var(--ink);border-radius:10px;padding:10px 16px;font-weight:600;letter-spacing:.02em}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
a.btn{text-decoration:none;display:inline-block;text-align:center}
.row-btns{display:flex;flex-wrap:wrap;gap:8px}

/* Guia */
.gl{display:grid;gap:12px}
.gl-item{display:grid;gap:3px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.gl-item:last-child{border-bottom:0;padding-bottom:0}
.gl-item b{font-family:var(--f-display);font-size:18px;font-weight:600}
.gl-item .q{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);font-weight:700}
.gl-item p{margin:0;font-size:14px;max-width:62ch}

/* Cronômetro, folha e aviso */
.timer{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:25;padding-inline:12px;padding-block:0 8px;pointer-events:none}
.timer-in{max-width:736px;margin:0 auto;background:var(--ink);color:var(--on-ink);border:1px solid rgba(226,201,136,.7);border-radius:16px;padding:10px 12px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;pointer-events:auto;box-shadow:0 10px 28px rgba(0,0,0,.35);position:relative;overflow:hidden}
.timer-t{min-width:0}
.timer-t small{display:block;font-size:11px;color:var(--on-ink-muted);letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer-t b{font-family:var(--f-display);font-size:30px;font-weight:700;color:var(--gold-on-ink);font-variant-numeric:tabular-nums;line-height:1.05}
.timer button{border:1px solid rgba(245,239,224,.25);background:transparent;color:var(--on-ink);border-radius:10px;padding:9px 11px;font-weight:600;font-size:13px}
.timer-bar{position:absolute;left:0;bottom:0;height:3px;background:var(--gold-on-ink)}
.timer.done .timer-in{border-color:#7DB57B}
.timer.done .timer-t b{color:#9ED39C}
.sheet-wrap{position:fixed;inset:0;z-index:50;display:grid;align-items:end}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
.sheet{position:relative;width:100%;max-width:760px;margin:0 auto;background:var(--surface);color:var(--fg);border-radius:20px 20px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:82vh;overflow:auto;display:grid;gap:10px}
.sheet header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet h2{margin:0;font-family:var(--f-display);font-size:23px;letter-spacing:.02em;text-wrap:balance}
.sheet p{margin:0;max-width:62ch}
.src{display:grid;gap:4px;font-size:13.5px}
.src div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:5px 0;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--on-ink);padding:8px 16px;border-radius:999px;font-size:13px;z-index:60;border:1px solid rgba(226,201,136,.55);max-width:calc(100% - 32px);text-align:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:16px;padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:21px;letter-spacing:.03em;margin-bottom:4px}
@media (max-width:400px){.set{grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 42px;gap:6px}.field input{padding-right:34px;font-size:19px}.hero h2{font-size:22px}.nav button{font-size:9.5px}}
@media (prefers-reduced-motion:no-preference){.timer-bar{transition:width .25s linear}.ok,.day,.tec{transition:background-color .15s,border-color .15s,color .15s}}
</style>
</head>

function temDados(it){return it&&it.s&&it.s.some(function(x){return num(x.kg)!=null||num(x.r)!=null;});}
function anterior(a,l,w,k){for(var i=w-1;i>=1;i--){var r=reg(a,l,i);var it=r&&r.itens&&r.itens[k];if(temDados(it))return {w:i,it:it};}return null;}
function feitas(it,n){if(!it||!it.s)return 0;var c=0;for(var i=0;i<it.s.length;i++){var x=it.s[i];if(x&&(x.ok||num(x.r)!=null))c++;}return Math.min(c,n);}

var LKEY='treino-vn-v1';
var Local={nome:'local',data:{registros:{},medidas:{}},ok:true,
  carregar:function(){if(this.carregado)return this.tinha;this.carregado=true;var raw=null;try{raw=localStorage.getItem(LKEY);}catch(e){this.ok=false;}
    if(raw){try{this.data=JSON.parse(raw)||this.data;}catch(e){}}
    this.data.registros=this.data.registros||{};this.data.medidas=this.data.medidas||{};this.tinha=raw!=null;return this.tinha;},
  init:function(){var tinha=this.carregar();
    if(!tinha){var self=this;MEDIDAS0.forEach(function(m){self.data.medidas[m.aluno+'_'+m.data]=m;});this.persist();}
    S.regs=this.data.registros;S.meds=this.data.medidas;},
  persist:function(){try{localStorage.setItem(LKEY,JSON.stringify(this.data));return true;}catch(e){this.ok=false;return false;}},
  saveReg:function(id,doc){this.data.registros[id]=S.regs[id]=doc;return this.persist()?Promise.resolve():Promise.reject({code:'storage'});},
  saveMed:function(id,doc){this.data.medidas[id]=S.meds[id]=doc;return this.persist()?Promise.resolve():Promise.reject({code:'storage'});}
};
var Db={nome:'db',db:null,
  saveReg:function(id,doc){return this.db.doc('registros/'+id).set(doc);},
  saveMed:function(id,doc){return this.db.doc('medidas/'+id).set(doc);}
};
/* Hibrido: le a base online e grava no aparelho quando o acesso nao permite gravar na base */
var Hib={nome:'hib',
  saveReg:function(id,doc){Local.data.registros[id]=doc;S.regs[id]=doc;return Local.persist()?Promise.resolve():Promise.reject({code:'storage'});},
  saveMed:function(id,doc){Local.data.medidas[id]=doc;S.meds[id]=doc;return Local.persist()?Promise.resolve():Promise.reject({code:'storage'});}
};
function entrarHibrido(){if(S.hibrido)return;S.hibrido=true;S.store=Hib;Local.carregar();
  var L=Local.data.registros;Object.keys(L).forEach(function(id){var d=S.regs[id];if(!d||(L[id].atualizado||'')>=(d.atualizado||''))S.regs[id]=L[id];});
  var M=Local.data.medidas;Object.keys(M).forEach(function(id){S.meds[id]=M[id];});
  setStatus('Salvo neste aparelho','off');agendar();}
function salvar(tipo,id,doc){var st=S.store,fn=tipo==='reg'?'saveReg':'saveMed';
  return st[fn](id,doc).catch(function(err){if(st===Db&&err&&err.code==='invalid_argument'){entrarHibrido();aviso('Sem permissão na base online. Os registros ficam salvos neste aparelho.');return Hib[fn](id,doc);}throw err;});}
function sincronizarLocal(){if(S.store!==Db)return;if(!Local.carregar())return;
  var L=Local.data.registros,M=Local.data.medidas,ids=Object.keys(L),mids=Object.keys(M),env=0;if(!ids.length&&!mids.length)return;
  var p=Promise.resolve();
  ids.forEach(function(id){p=p.then(function(){var loc=L[id],d=S.regs[id];if(d&&(d.atualizado||'')>(loc.atualizado||'')){delete L[id];return;}
    return Db.saveReg(id,loc).then(function(){S.regs[id]=loc;delete L[id];env++;});});});
  mids.forEach(function(id){p=p.then(function(){return Db.saveMed(id,M[id]).then(function(){S.meds[id]=M[id];delete M[id];});});});
  p.then(function(){Local.persist();if(env)aviso(env+(env===1?' sessão salva':' sessões salvas')+' neste aparelho '+(env===1?'foi enviada':'foram enviadas')+' para a base');agendar();})
   .catch(function(err){Local.persist();if(err&&err.code==='invalid_argument')entrarHibrido();});}
var pend={},fila={};
function statusOk(){return S.store===Db?'Sincronizado':(Local.ok?'Salvo neste aparelho':'Sem espaço para salvar');}
function clsOk(){return S.store===Db?'':'off';}
function setStatus(t,cls){var el=$('#status');el.textContent=t;el.className='status'+(cls?' '+cls:'');}
function gravarReg(id){setStatus('Salvando','busy');clearTimeout(pend[id]);var tk=setTimeout(function(){
    var body=clone(S.regs[id]);body.atualizado=new Date().toISOString();
    fila[id]=(fila[id]||Promise.resolve()).then(function(){return salvar('reg',id,body);}).then(function(){if(pend[id]===tk)delete pend[id];setStatus(statusOk(),clsOk());})
      .catch(function(){if(pend[id]===tk)delete pend[id];setStatus('Não salvou. Tente de novo','err');});
  },500);pend[id]=tk;}

function volumeDe(p){var v={},src={};p.treinos.forEach(function(t){t.exercicios.forEach(function(e){if(!forca(e))return;Object.keys(e.musc).forEach(function(k){var f=e.musc[k];v[k]=(v[k]||0)+e.series*f;(src[k]=src[k]||[]).push({t:t.letra,n:e.nome,s:e.series,f:f});});});});return {v:v,src:src};}
function estado(k,val){var m=MICRO[k];if(!m||m.sem)return {c:'na',t:'Fora das tabelas do estudo'};
  if(val>m.mrv[1])return {c:'over',t:'Acima do limite de recuperação'};if(val>=m.mrv[0])return {c:'mrv',t:'No limite de recuperação'};

function vMedidas(p){

      var f=null,l=null,cnt=0;vals.forEach(function(v){if(v!=null){if(f==null)f=v;l=v;cnt++;}});var d=cnt>1?l-f:null;

    h+='</tbody></table></div><p class="lead">Verde e vermelho seguem a direção desejada: cintura, abdômen e gordura descendo, músculo subindo. Em azul, as medidas que dependem do objetivo do bloco.</p>';}
  h+='<form class="card" id="mform"><h2>Nova medição</h2><div class="grid-f"><label>Data<input type="date" id="m-data" value="'+hojeISO()+'" required></label>'+CAMPOS.map(function(c){return '<label>'+c[1]+(c[2]?' ('+c[2]+')':'')+'<input inputmode="decimal" id="m-'+c[0]+'"></label>';}).join('')+'</div>'+
    '<div class="grid-f" style="grid-template-columns:1fr"><label>Observação<input id="m-nota" placeholder="Condições da aferição, balança usada, fase do ciclo"></label></div><button class="btn" type="submit">Salvar medição</button></form>';

function graficoPeso(pts){var W=640,H=190,pl=40,pr=16,pt=16,pb=28;var t0=new Date(pts[0].data).getTime(),t1=new Date(pts[pts.length-1].data).getTime();
  var ys=pts.map(function(x){return x.peso;});var lo=Math.floor(Math.min.apply(null,ys)-1),hi=Math.ceil(Math.max.apply(null,ys)+1);
  var X=function(d){return pl+(new Date(d).getTime()-t0)/((t1-t0)||1)*(W-pl-pr);},Y=function(v){return pt+(hi-v)/((hi-lo)||1)*(H-pt-pb);};
  var g='',step=Math.max(1,Math.ceil((hi-lo)/4));for(var v=lo;v<=hi;v+=step)g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)"/><text x="'+(pl-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)">'+v+'</text>';
  var path=pts.map(function(x,i){return (i?'L':'M')+X(x.data).toFixed(1)+' '+Y(x.peso).toFixed(1);}).join(' ');
  var area=path+' L'+X(pts[pts.length-1].data).toFixed(1)+' '+(H-pb)+' L'+X(pts[0].data).toFixed(1)+' '+(H-pb)+' Z';
  var dots=pts.map(function(x,i){var last=i===pts.length-1;return '<circle cx="'+X(x.data)+'" cy="'+Y(x.peso)+'" r="'+(last?5:3.5)+'" fill="'+(last?'var(--gold)':'var(--surface)')+'" stroke="var(--gold)" stroke-width="2"/>';}).join('');
  var lb=pts.map(function(x,i){return (i===0||i===pts.length-1)?'<text x="'+X(x.data)+'" y="'+(H-8)+'" text-anchor="'+(i?'end':'start')+'" font-size="11" fill="var(--muted)">'+x.data.slice(8)+'/'+x.data.slice(5,7)+'</text>':'';}).join('');
  var last=pts[pts.length-1],d=last.peso-pts[0].peso;
  return '<section class="card chart"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="eyebrow muted">Peso corporal</span><span style="font-family:var(--f-display);font-size:20px;font-weight:700">'+fmt(last.peso)+' kg <span class="'+(d<0?'var-up':'var-down')+'" style="font-size:14px">'+(d>0?'+':'')+fmt(d)+'</span></span></div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolução do peso">'+g+'<path d="'+area+'" fill="var(--gold)" opacity=".13"/><path d="'+path+'" fill="none" stroke="var(--gold)" stroke-width="2.5"/>'+dots+lb+'</svg></section>';}

  return h;
}

function audioPronto(){try{if(!TM.audio){var A=window.AudioContext||window.webkitAudioContext;if(A)TM.audio=new A();}if(TM.audio&&TM.audio.state==='suspended')TM.audio.resume();}catch(e){}}
function bip(){try{var a=TM.audio;if(!a)return;[0,.22].forEach(function(o){var os=a.createOscillator(),g=a.createGain();os.frequency.value=880;g.gain.setValueAtTime(.0001,a.currentTime+o);g.gain.exponentialRampToValueAtTime(.3,a.currentTime+o+.02);g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+o+.16);os.connect(g);g.connect(a.destination);os.start(a.currentTime+o);os.stop(a.currentTime+o+.18);});}catch(e){}}
function iniciarDescanso(seg,rot){audioPronto();clearTimeout(TM.hide);TM.dur=seg;TM.fim=Date.now()+seg*1000;$('#timer-l').textContent='Descanso · '+rot;var el=$('#timer');el.hidden=false;el.classList.remove('done');document.body.classList.add('timing');
  try{if(navigator.wakeLock&&!TM.lock)navigator.wakeLock.request('screen').then(function(l){TM.lock=l;}).catch(function(){});}catch(e){}
  clearInterval(TM.iv);TM.iv=setInterval(tique,250);tique();}
function tique(){var ms=TM.fim-Date.now(),s=Math.max(0,Math.ceil(ms/1000));$('#timer-v').textContent=Math.floor(s/60)+':'+pad(s%60);$('#timer-bar').style.width=(TM.dur?Math.max(0,ms)/(TM.dur*1000)*100:0)+'%';
  if(ms<=0){clearInterval(TM.iv);TM.iv=null;$('#timer').classList.add('done');$('#timer-v').textContent='Próxima série';bip();try{if(navigator.vibrate)navigator.vibrate([220,120,220]);}catch(e){}TM.hide=setTimeout(pararDescanso,6000);}}

function exportar(){var data=JSON.stringify({app:'treino-vn',versao:1,exportado:new Date().toISOString(),registros:S.regs,medidas:S.meds});var nome='treino-backup-'+hojeISO()+'.json';
  if(MODO==='online'){if(!S.dl){aviso('Exportação indisponível nesta visualização');return;}S.dl.save({filename:nome,data:data}).then(function(){aviso('Backup salvo');}).catch(function(e){if(e&&e.code==='declined')return;aviso('Não foi possível salvar o arquivo aqui');});return;}
  try{var blob=new Blob([data],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=nome;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1500);aviso('Backup baixado');}catch(e){aviso('Este navegador não permitiu baixar o arquivo');}}
function importar(file){var fr=new FileReader();fr.onload=function(){var j;try{j=JSON.parse(fr.result);}catch(e){aviso('Arquivo inválido');return;}
    if(!j||typeof j!=='object'||(!j.registros&&!j.medidas)){aviso('Esse arquivo não é um backup do Diário de Treino');return;}
    var tarefas=[],nR=0,nM=0;
    Object.keys(j.registros||{}).forEach(function(id){var d=j.registros[id];if(!d||!d.aluno)return;var cur=S.regs[id];if(cur&&cur.atualizado&&d.atualizado&&cur.atualizado>d.atualizado)return;S.regs[id]=d;nR++;tarefas.push(function(){return salvar('reg',id,d);});});
    Object.keys(j.medidas||{}).forEach(function(id){var d=j.medidas[id];if(!d||!d.aluno)return;S.meds[id]=d;nM++;tarefas.push(function(){return salvar('med',id,d);});});
    setStatus('Importando','busy');tarefas.reduce(function(pr,fn){return pr.then(fn);},Promise.resolve()).then(function(){setStatus(statusOk(),clsOk());aviso(nR+' sessões e '+nM+' medições importadas');render();}).catch(function(){setStatus('Importação incompleta','err');render();});};
  fr.readAsText(file);}

function usarLocal(msg){S.store=Local;Local.init();setStatus(msg,'off');render();}
function esperar(ms){return new Promise(function(r){setTimeout(r,ms);});}
(async function(){
  render();
  if(MODO==='offline'){usarLocal(Local.ok?'Salvo neste aparelho':'Sem espaço para salvar');return;}
  var cl=window.claude;for(var i=0;i<30&&!cl;i++){await esperar(100);cl=window.claude;}
  var db=null;try{db=cl?await cl.use('db'):null;}catch(e){db=null;}
  if(!db){usarLocal('Sem a base online · salvo neste aparelho');return;}
  Db.db=db;S.store=Db;setStatus('Conectando','busy');
  try{S.dl=await cl.use('downloads');}catch(e){S.dl=null;}
  var pode=null;try{var u=await cl.use('user');pode=u?await u.can('data.write'):null;}catch(e){pode=null;}
  if(pode===false)entrarHibrido();
  var prontoR=false,prontoM=false;
  db.collection('registros').onSnapshot(function(snap){snap.docChanges().forEach(function(ch){var id=ch.doc.id,loc=S.hibrido?Local.data.registros[id]:null;
      if(ch.type==='removed'){if(!loc)delete S.regs[id];return;}if(pend[id])return;var d=ch.doc.data();
      if(loc&&(loc.atualizado||'')>=(d.atualizado||''))return;S.regs[id]=clone(d);});
    if(!prontoR){prontoR=true;if(!S.hibrido)setStatus('Sincronizado');sincronizarLocal();}agendar();},function(){setStatus('Sem sincronização','err');});
  db.collection('medidas').onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){m[d.id]=d.data();});
    if(S.hibrido){var L=Local.data.medidas;Object.keys(L).forEach(function(id){m[id]=L[id];});}
    S.meds=m;if(!prontoM){prontoM=true;}if(S.view==='medidas')agendar();},function(){});
})();
})();
</script>

if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(function(){});}
</script>
